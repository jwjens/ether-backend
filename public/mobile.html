<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ether — Now Playing</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080810; --bg2: #0d0d1a; --bg3: #13131f;
    --cyan: #38bdf8; --green: #34d399; --purple: #a78bfa;
    --amber: #fbbf24; --red: #f87171;
    --text: #f0f0f8; --text2: rgba(240,240,248,0.6); --text3: rgba(240,240,248,0.3);
    --border: rgba(255,255,255,0.08);
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

  .app { min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  header {
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(8,8,16,0.9); backdrop-filter: blur(20px);
    position: sticky; top: 0; z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; }
  .logo-icon { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--cyan), var(--purple)); display: flex; align-items: center; justify-content: center; }
  .on-air-badge { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; }
  .on-air-badge.live { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
  .on-air-badge.off { background: rgba(255,255,255,0.05); color: var(--text3); border: 1px solid var(--border); }
  .badge-dot { width: 5px; height: 5px; border-radius: 50%; }

  /* Now Playing hero */
  .now-playing {
    padding: 32px 20px;
    text-align: center;
    position: relative; overflow: hidden;
  }
  .art-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: blur(40px) brightness(0.3) saturate(1.5);
    transform: scale(1.2);
    transition: background-image 1s ease;
  }
  .art-frame {
    width: 200px; height: 200px;
    border-radius: 20px; margin: 0 auto 24px;
    background: var(--bg2); border: 1px solid var(--border);
    overflow: hidden; position: relative; z-index: 1;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transition: all 0.5s ease;
  }
  .art-frame img { width: 100%; height: 100%; object-fit: cover; }
  .art-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

  .now-title { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 4px; position: relative; z-index: 1; }
  .now-artist { font-size: 14px; color: var(--text2); margin-bottom: 20px; position: relative; z-index: 1; }

  .progress-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-bottom: 8px; position: relative; z-index: 1; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--cyan); border-radius: 2px; transition: width 1s linear; }
  .progress-times { display: flex; justify-content: space-between; font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; position: relative; z-index: 1; }

  /* Queue */
  .queue-section { flex: 1; padding: 0 0 20px; }
  .section-label { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: var(--text3); text-transform: uppercase; padding: 16px 20px 8px; }

  .queue-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .queue-item:active { background: rgba(255,255,255,0.03); }
  .queue-num { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; width: 16px; text-align: center; flex-shrink: 0; }
  .queue-art { width: 40px; height: 40px; border-radius: 8px; background: var(--bg2); overflow: hidden; flex-shrink: 0; }
  .queue-art img { width: 100%; height: 100%; object-fit: cover; }
  .queue-info { flex: 1; min-width: 0; }
  .queue-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue-artist { font-size: 11px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue-dur { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; flex-shrink: 0; }

  /* History */
  .history-item {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 20px;
    opacity: 0.6;
  }

  /* Connection status */
  .connect-screen {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px; text-align: center; gap: 16px;
  }
  .connect-icon { width: 64px; height: 64px; border-radius: 20px; background: var(--bg2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .connect-title { font-size: 20px; font-weight: 800; }
  .connect-sub { font-size: 13px; color: var(--text2); line-height: 1.6; max-width: 280px; }
  .connect-input { width: 100%; max-width: 300px; padding: 12px 16px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--border); color: var(--text); font-size: 14px; outline: none; text-align: center; font-family: 'DM Mono', monospace; }
  .connect-input:focus { border-color: var(--cyan); }
  .connect-btn { width: 100%; max-width: 300px; padding: 14px; border-radius: 10px; background: var(--cyan); color: #000; font-size: 14px; font-weight: 800; border: none; cursor: pointer; }

  /* Refresh indicator */
  .refresh-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse-dot 2s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

  .clock { font-size: 13px; color: var(--text3); font-family: 'DM Mono', monospace; }
</style>
</head>
<body>
<div class="app" id="app">

  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      Ether
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="refresh-dot" id="refreshDot" style="display:none"></div>
      <div class="clock" id="clock"></div>
      <div class="on-air-badge off" id="onAirBadge">
        <div class="badge-dot" id="onAirDot" style="background:rgba(240,240,248,0.3)"></div>
        <span id="onAirLabel">OFF AIR</span>
      </div>
    </div>
  </header>

  <!-- Connect screen -->
  <div class="connect-screen" id="connectScreen">
    <div class="connect-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,248,0.4)" stroke-width="1.5" stroke-linecap="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
    <div class="connect-title">Connect to Ether</div>
    <div class="connect-sub">Enter your Ether station's local address to see what's playing.</div>
    <input class="connect-input" id="serverInput" placeholder="192.168.1.x:4242" type="text" inputmode="url" autocomplete="off" autocorrect="off">
    <button class="connect-btn" onclick="connect()">Connect</button>
    <div style="font-size:11px;color:var(--text3);margin-top:-8px">Find the address in Ether → Tools → System Health</div>
  </div>

  <!-- Main view -->
  <div id="mainView" style="display:none;flex-direction:column;flex:1">
    <!-- Now Playing -->
    <div class="now-playing">
      <div class="art-bg" id="artBg"></div>
      <div class="art-frame">
        <img id="artImg" src="" alt="" style="display:none">
        <div class="art-placeholder" id="artPlaceholder">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,248,0.2)" stroke-width="1.5" stroke-linecap="round">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
      </div>
      <div class="now-title" id="nowTitle">No track loaded</div>
      <div class="now-artist" id="nowArtist">—</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-times">
        <span id="timeElapsed">0:00</span>
        <span id="timeRemaining">—:——</span>
      </div>
    </div>

    <!-- Queue -->
    <div class="queue-section">
      <div class="section-label">Up Next</div>
      <div id="queueList"></div>
      <div class="section-label" style="margin-top:8px">Recently Played</div>
      <div id="historyList"></div>
    </div>
  </div>

</div>

<script>
let serverUrl = localStorage.getItem('ether_server') || '';
let pollTimer = null;
let lastTitle = '';

// Clock
function updateClock() {
  const d = new Date();
  document.getElementById('clock').textContent =
    d.getHours().toString().padStart(2,'0') + ':' +
    d.getMinutes().toString().padStart(2,'0') + ':' +
    d.getSeconds().toString().padStart(2,'0');
}
setInterval(updateClock, 1000);
updateClock();

function fmt(s) {
  if (!s || s <= 0) return '0:00';
  const m = Math.floor(s / 60);
  return m + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

async function fetchArtwork(title, artist) {
  try {
    const clean = s => s.replace(/\s*[-–]\s*(remaster.*)/gi,'').replace(/\s*\(feat\..*?\)/gi,'').trim();
    const q = encodeURIComponent(`${clean(title)} ${clean(artist||'')}`);
    const r = await fetch(`https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=1`);
    const d = await r.json();
    const art = d?.results?.[0]?.artworkUrl100;
    return art ? art.replace('100x100bb','600x600bb') : null;
  } catch { return null; }
}

async function poll() {
  const dot = document.getElementById('refreshDot');
  dot.style.display = 'block';
  try {
    const res = await fetch(`http://${serverUrl}/api/now-playing`, { signal: AbortSignal.timeout(3000) });
    const data = await res.json();

    // On air badge
    const badge = document.getElementById('onAirBadge');
    const label = document.getElementById('onAirLabel');
    const bdot = document.getElementById('onAirDot');
    if (data.playing) {
      badge.className = 'on-air-badge live';
      label.textContent = 'ON AIR';
      bdot.style.background = '#f87171';
      bdot.style.animation = 'pulse-dot 1s ease-in-out infinite';
    } else {
      badge.className = 'on-air-badge off';
      label.textContent = 'OFF AIR';
      bdot.style.background = 'rgba(240,240,248,0.3)';
      bdot.style.animation = 'none';
    }

    // Now playing
    const title = data.title || 'No track loaded';
    const artist = data.artist || '—';
    document.getElementById('nowTitle').textContent = title;
    document.getElementById('nowArtist').textContent = artist;

    const pos = data.position || 0;
    const dur = data.duration || 0;
    const pct = dur > 0 ? Math.min(100, (pos / dur) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('timeElapsed').textContent = fmt(pos);
    document.getElementById('timeRemaining').textContent = dur > 0 ? fmt(dur - pos) : '—:——';

    // Artwork — only fetch when title changes
    if (title !== lastTitle && title !== 'No track loaded') {
      lastTitle = title;
      const artUrl = await fetchArtwork(title, artist);
      const img = document.getElementById('artImg');
      const placeholder = document.getElementById('artPlaceholder');
      const bg = document.getElementById('artBg');
      if (artUrl) {
        img.src = artUrl;
        img.style.display = 'block';
        placeholder.style.display = 'none';
        bg.style.backgroundImage = `url(${artUrl})`;
      } else {
        img.style.display = 'none';
        placeholder.style.display = 'flex';
        bg.style.backgroundImage = 'none';
      }
    }

    // Queue
    const queueEl = document.getElementById('queueList');
    queueEl.innerHTML = '';
    (data.queue || []).slice(0,8).forEach((item, i) => {
      queueEl.innerHTML += `
        <div class="queue-item">
          <div class="queue-num">${i+1}</div>
          <div class="queue-art"><div style="width:100%;height:100%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:14px">🎵</div></div>
          <div class="queue-info">
            <div class="queue-title">${item.title || '—'}</div>
            <div class="queue-artist">${item.artist || '—'}</div>
          </div>
          <div class="queue-dur">${item.duration ? fmt(item.duration/1000) : ''}</div>
        </div>`;
    });

    // History
    const histEl = document.getElementById('historyList');
    histEl.innerHTML = '';
    (data.history || []).slice(0,5).forEach(item => {
      const d = new Date(item.played_at * 1000);
      const t = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
      histEl.innerHTML += `
        <div class="history-item">
          <div style="font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;width:32px;flex-shrink:0">${t}</div>
          <div class="queue-info">
            <div class="queue-title">${item.title||'—'}</div>
            <div class="queue-artist">${item.artist||'—'}</div>
          </div>
        </div>`;
    });

  } catch (e) {
    // Connection lost
    if (e.name !== 'AbortError') {
      document.getElementById('nowTitle').textContent = 'Connection lost';
      document.getElementById('nowArtist').textContent = 'Retrying...';
    }
  }
  dot.style.display = 'none';
}

function connect() {
  const input = document.getElementById('serverInput').value.trim();
  if (!input) return;
  serverUrl = input.replace(/^https?:\/\//, '');
  localStorage.setItem('ether_server', serverUrl);
  startPolling();
}

function startPolling() {
  document.getElementById('connectScreen').style.display = 'none';
  document.getElementById('mainView').style.display = 'flex';
  poll();
  pollTimer = setInterval(poll, 3000);
}

// Auto-connect if we have a saved server
if (serverUrl) {
  document.getElementById('serverInput').value = serverUrl;
  startPolling();
}

// Pull-to-refresh
let startY = 0;
document.addEventListener('touchstart', e => { startY = e.touches[0].clientY; });
document.addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - startY > 80 && window.scrollY === 0) poll();
});
</script>
</body>
</html>
